name: Validate published simulations

on:
  workflow_dispatch:
    inputs:
      replications:
        description: Monte Carlo repetitions
        required: true
        default: "200"
      bootstrap_replicates:
        description: Bootstrap repetitions per sample
        required: true
        default: "499"

permissions:
  contents: read

jobs:
  r-density-model2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::testthat
      - name: Install package
        run: R CMD INSTALL r
      - name: Run published Model 2 simulation
        run: >-
          Rscript validation/paper_density_validation.R
          ${{ inputs.replications }}
          ${{ inputs.bootstrap_replicates }}
          201
          validation/results/model2-r.csv
      - uses: actions/upload-artifact@v4
        with:
          name: model2-r-results
          path: validation/results/model2-r.csv
          if-no-files-found: error
