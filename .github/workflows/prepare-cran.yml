name: Prepare CRAN submission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
      - name: Build source package
        run: R CMD build r
      - name: Check source package
        run: R CMD check --as-cran debiasedInference_*.tar.gz
      - name: Upload CRAN source package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debiasedInference-cran-source
          path: debiasedInference_*.tar.gz
          if-no-files-found: error
      - name: Upload check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debiasedInference-check-results
          path: debiasedInference.Rcheck/
          if-no-files-found: ignore
